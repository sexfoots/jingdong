name: 构建 iOS IPA 免签安装包 (适用 TrollStore 巨魔商店)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: 检出项目源码
        uses: actions/checkout@v4

      - name: 编译构建免签应用 (.app)
        run: |
          xcodebuild -project JDWSKeyGrabber.xcodeproj \
                     -scheme JDWSKeyGrabber \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: 打包成 TrollStore 可用的 .ipa 文件
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/JDWSKeyGrabber.app Payload/ || cp -r ~/Library/Developer/Xcode/DerivedData/JDWSKeyGrabber-*/Build/Products/Release-iphoneos/JDWSKeyGrabber.app Payload/
          zip -r JDWSKeyGrabber.ipa Payload
          echo "IPA 打包成功！"

      - name: 上传构建产物至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JDWSKeyGrabber-TrollStore-IPA
          path: JDWSKeyGrabber.ipa
